# Modo HTTPS (plantilla https.conf.template): DOMAIN definido y certificado emitido.
# envsubst solo sustituye ${DOMAIN} (NGINX_ENVSUBST_FILTER); las variables de nginx quedan intactas.
server {
  listen 80;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://${DOMAIN}$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${DOMAIN};
  root /usr/share/nginx/html;

  ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  include /etc/nginx/snippets/app-locations.conf;
}
