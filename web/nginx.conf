# Modo HTTP (plantilla http.conf.template): desarrollo, DOMAIN vacío, o DOMAIN definido sin certificado emitido.
# No hay server en el puerto 443: sin certificado nginx no podría arrancar con "listen 443 ssl".
server {
  listen 80;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Desafío HTTP-01 de Let's Encrypt, servido desde el volumen compartido con certbot.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  include /etc/nginx/snippets/app-locations.conf;
}
