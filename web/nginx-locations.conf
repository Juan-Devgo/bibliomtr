# Ubicaciones compartidas por el modo HTTP y el modo HTTPS (se incluye desde nginx.conf y nginx-https.conf).
# No define proxy_read_timeout: rige el valor predeterminado de nginx (60 s).

location /api/ {
  proxy_pass http://api:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# SPA: las rutas del cliente vuelven a index.html.
location / {
  try_files $uri /index.html;
}
