spring.application.name=bibliomtr

# Base de datos: en desarrollo la conexión la aporta spring-boot-docker-compose (compose.dev.yaml);
# en Docker/producción se define con SPRING_DATASOURCE_URL, _USERNAME y _PASSWORD.
spring.docker.compose.file=compose.dev.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# API
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,info

# Corpus: los 20 PDF entregados por el docente (constitución P5).
bibliomtr.corpus.dir=${BIBLIOMTR_CORPUS_DIR:corpus}

# Embeddings: SPECTER2 base exportado a ONNX (scripts/download-model.sh); vector = token [CLS] con L2.
bibliomtr.embeddings.model-path=classpath:models/specter2-base/model.onnx
bibliomtr.embeddings.tokenizer-path=classpath:models/specter2-base/tokenizer.json

# Mediciones JMH (spec 002, REQ-17, REQ-21): jar de benchmarks que se lanza como proceso hijo
# (./gradlew jmhJar; en Docker /app/benchmarks.jar) y límite de 10 minutos por medición.
bibliomtr.benchmark.jar=${BIBLIOMTR_BENCHMARK_JAR:build/libs/benchmarks.jar}
bibliomtr.benchmark.timeout=10m

# Ingesta del corpus al arrancar (spec 001, REQ-8): PDF de bibliomtr.corpus.dir -> tabla article.
# Los tests la desactivan en src/test/resources/config/application.properties.
bibliomtr.ingestion.enabled=true

# Ollama local con nomic-embed-text (spec 001, REQ-9): solo genera el vector (constitución P3).
# Modelo con versión fijada (constitución P12); en Docker la URL es http://ollama:11434.
bibliomtr.ollama.base-url=${BIBLIOMTR_OLLAMA_URL:http://localhost:11434}
bibliomtr.ollama.model=nomic-embed-text:v1.5
bibliomtr.ollama.timeout=60s
# POST /api/pull usa su propio límite de lectura: bajar nomic-embed-text (~274 MB) supera el de arriba.
bibliomtr.ollama.pull-timeout=15m

# Granularidad de Levenshtein y Needleman-Wunsch (spec 001, REQ-3): WORDS (tokens) o CHARACTERS.
# Decisión de los estudiantes; ver docs/guia-implementacion.md.
bibliomtr.similarity.edit-granularity=WORDS
