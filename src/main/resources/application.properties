spring.application.name=bibliomtr

# Base de datos: en desarrollo la conexión la aporta spring-boot-docker-compose (compose.dev.yaml);
# en Docker/producción se define con SPRING_DATASOURCE_URL, _USERNAME y _PASSWORD.
spring.docker.compose.file=compose.dev.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# API
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,info

# Corpus: los 20 PDF entregados por el docente (constitución P5).
bibliomtr.corpus.dir=${BIBLIOMTR_CORPUS_DIR:corpus}

# Embeddings: modelo sentence-transformers exportado a ONNX (scripts/download-model.sh).
bibliomtr.embeddings.model-path=classpath:models/all-MiniLM-L6-v2/model.onnx
bibliomtr.embeddings.tokenizer-path=classpath:models/all-MiniLM-L6-v2/tokenizer.json
